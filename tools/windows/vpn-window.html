<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConcordeVPN</title>
<!--
  The ConcordeVPN main window as 1.5 draws it: a 2x capture of the app's REAL
  page (concordevpn.py), served by the app's own code on a throwaway
  HOME with a fake, healthy state (connected, exit verified, Location Auto,
  Optimize Balanced, a last measurement), at the app's fixed 460 px width and the
  590 px its own /api/fit gives this content (#route bottom 571 + 16 + 2 -> 590).
  The titlebar is native macOS chrome in the app (a transparent
  full-size-content titlebar, lockup and gearshape as titlebar accessories,
  zoom disabled), so it is drawn here on top of the capture, over the page's
  32px #top strip. The exit IP line is empty on purpose: it never goes on the
  site. tools/README.md says how to retake vpn-capture.png.
  Replaces the earlier hand-frozen 460 x 856 copy of the 1.4 page (git history).
-->
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--line:#26272c;--disp:'Michroma','Space Grotesk',system-ui,sans-serif}
html{margin:0;height:auto;min-height:100vh;display:grid;place-items:center;padding:40px;
  box-sizing:border-box;overflow:hidden;background:linear-gradient(transparent,transparent)}
body{margin:0;position:relative;width:460px;height:590px;flex:none;border-radius:12px;overflow:hidden;
  background:#101013 url(vpn-capture.png) 0 0/460px 590px no-repeat;
  transform:translateZ(0);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.04);
  outline:1px solid var(--line);outline-offset:-1px}
.chrome{position:absolute;left:0;top:0;right:0;height:32px;z-index:120;
  pointer-events:none}
.lights{position:absolute;left:13px;top:10px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
/* zoom is disabled in the app (the window fits its content): the system
   draws a disabled button grey */
.lights i:nth-child(3){background:#4b4c52}
.lockup{position:absolute;left:0;right:0;top:0;height:32px;display:flex;
  align-items:center;justify-content:center;gap:6px}
.lockup svg{display:block;width:15px;height:12.6px}
.lockup b{font-family:var(--disp);font-weight:400;font-size:11.5px;
  letter-spacing:1.7px;color:#fff;line-height:1;margin-right:-1.7px}
/* NSStrokeWidth -12 on "VPN": a stroke 12% of the point size over the fill */
.lockup .tld{-webkit-text-stroke:1.38px #fff}
.gearbtn{position:absolute;right:11px;top:8px;width:16px;height:16px;display:block}
</style>
</head>
<body>

<div class="chrome" aria-hidden="true">
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="lockup">
    <svg viewBox="2 2.3 19.6 16.4"><g stroke="#b7bcc6" stroke-width="2.4" stroke-linecap="round">
      <line x1="3.2" y1="17.5" x2="20.4" y2="3.5"/><line x1="7.5" y1="17.5" x2="20.4" y2="7"/>
      <line x1="11.8" y1="17.5" x2="20.4" y2="10.5"/><line x1="16.1" y1="17.5" x2="20.4" y2="14"/>
      <line x1="19.3" y1="17.5" x2="20.4" y2="16.6"/></g></svg>
    <b>CONCORDE<span class="tld">VPN</span></b>
  </div>
  <!-- SF Symbol "gearshape", white at 60% -->
  <svg class="gearbtn" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.25" stroke-linejoin="round">
    <path d="M6.80 2.99 L7.08 1.16 L8.92 1.16 L9.20 2.99 L10.69 3.61 L12.19 2.51 L13.49 3.81 L12.39 5.31 L13.01 6.80 L14.84 7.08 L14.84 8.92 L13.01 9.20 L12.39 10.69 L13.49 12.19 L12.19 13.49 L10.69 12.39 L9.20 13.01 L8.92 14.84 L7.08 14.84 L6.80 13.01 L5.31 12.39 L3.81 13.49 L2.51 12.19 L3.61 10.69 L2.99 9.20 L1.16 8.92 L1.16 7.08 L2.99 6.80 L3.61 5.31 L2.51 3.81 L3.81 2.51 L5.31 3.61 Z"/>
    <circle cx="8" cy="8" r="2.35"/>
  </svg>
</div>

</body>
</html>
