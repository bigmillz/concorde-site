<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConcordeVPN</title>
<!--
  The ConcordeVPN main window, frozen from the app's REAL page (concordevpn.py
  at HEAD of the 1.4 RC line; the main window shows no version any more, it
  lives in Settings). The <style> is that page's own stylesheet, cut to the
  rules this window uses, text unchanged but for its comments; the markup is
  the page's #stage as it rendered in headless Chrome against a fake, healthy
  state (connected, exit verified, Location Auto, Optimize Balanced: the
  app's defaults); the three canvases are drawn by the page's own drawSpark /
  drawGlobe / drawStars. The titlebar is native macOS chrome in the app (a
  transparent full-size-content titlebar, lockup and gearshape as titlebar
  accessories, zoom disabled), so it is drawn here on top of the page.
  The line under "Your traffic leaves through ..." is empty on purpose: in
  the app it is the exit IP, which never goes on the site.
  Window 460 x 856: the app's fixed width, and the height its own /api/fit
  gives this content (#route bottom 838 + 16 + 2).
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Michroma&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101013;
  --panel:#0a0a0c;
  --panel2:#191a1e;
  --line:#26272c;
  --line-soft:#1e1f23;
  --text:#ececec;
  --dim:#b4b4b4;
  --faint:#8e8e8e;
  --accent:#ececec;
  --accent-hot:#fff;
  --accent-dim:rgba(255,255,255,.10);
  --red:#e26d5a;
  --radius:10px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --disp:'Michroma','Space Grotesk',system-ui,sans-serif;
  --silver:linear-gradient(90deg,#f5f6f8,#c8ccd5,#9aa0ac,#e2e5ea,#8f95a1,#d5d8df,#f5f6f8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body::after{content:"";position:fixed;left:0;top:32px;right:0;height:1px;
  background:rgba(200,210,255,.14);pointer-events:none;z-index:99}
body::before{content:"";position:fixed;left:0;top:33px;right:0;height:18px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.20) 50%,
    rgba(0,0,0,0));
  pointer-events:none;z-index:98}
body{background:var(--bg);
  color:var(--text);font-family:var(--sans);
  font-size:15px;overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;cursor:default}
::selection{background:var(--accent-dim);color:var(--accent-hot)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--sans);border:0;background:none;color:inherit;cursor:pointer}
input{font-family:var(--mono);font-size:12.5px;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;width:100%;outline:none;
  -webkit-user-select:text;user-select:text}
input:focus{border-color:#3a3b41}
body{opacity:0;animation:bootIn .5s ease .05s forwards}
#top{display:flex;align-items:center;padding:0;height:32px;
  flex:none;position:relative;z-index:5}
#stage{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:none;max-width:428px;margin:0 auto;padding:14px 16px 16px}
.view.on{display:block}
#stage{position:relative}
#v-main{position:relative}
#globewrap{position:fixed;left:0;top:0;right:0;bottom:0;
  overflow:hidden;pointer-events:none;z-index:0;
  
  background:
    
    linear-gradient(to top, rgba(154,170,202,.095),
                    rgba(154,170,202,.052) 11%,
                    rgba(154,170,202,.022) 22%,
                    rgba(0,0,0,0) 35%),
    radial-gradient(115% 78% at 50% 26%, rgba(214,220,232,.055),
                    rgba(0,0,0,0) 62%),
    radial-gradient(85% 58% at 76% 86%, rgba(150,160,180,.042),
                    rgba(0,0,0,0) 70%)}
#stars{position:absolute;left:0;top:0;width:100%;height:100%;
  opacity:0;transition:opacity .8s}
#globe{position:absolute;left:50%;top:-120px;
  width:1200px;height:1200px;
  transform:translateX(-50%) rotate(30deg);
  opacity:0;transition:opacity .4s}
#hero{text-align:center;padding-top:22px;position:relative;z-index:1}
#power{width:186px;height:186px;border-radius:50%;position:relative;
  transition:filter .5s ease}
#power svg{width:100%;height:100%;display:block}
#power .track{fill:none;stroke:var(--line-soft);stroke-width:5}
#power .prog{fill:none;stroke:url(#ringg);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:553 553;stroke-dashoffset:553;
  transform:rotate(-90deg);transform-origin:100px 100px;
  transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.3,1)}
#power .pwr{fill:none;stroke:var(--faint);stroke-width:7;
  stroke-linecap:round;transition:stroke .3s,filter .3s}
#power:hover .pwr{stroke:var(--dim)}
#power.on .prog{stroke-dashoffset:0}
#power.on .pwr{stroke:#f4f5f8;
  filter:drop-shadow(0 0 10px rgba(222,226,234,.55))}
#power.on{filter:drop-shadow(0 0 26px rgba(222,226,234,.16))}
#orbit{position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity 1s ease;z-index:2;
  animation:orbitspin 9s linear infinite;animation-play-state:paused}
#power.on #orbit,#power.busy.up #orbit{opacity:1;animation-play-state:running}
#orbit i{position:absolute;display:block}
#orbit .tail{inset:0;border-radius:50%;opacity:var(--gt,.2);
  transition:opacity 2.4s ease;
  background:conic-gradient(from calc(360deg - var(--tail,45deg)),
    rgba(210,224,255,0) 0deg,
    rgba(220,230,255,.16) calc(var(--tail,45deg) * .42),
    rgba(240,246,255,.45) calc(var(--tail,45deg) * .72),
    rgba(255,255,255,.85) calc(var(--tail,45deg) - 14deg),
    rgba(255,255,255,0) var(--tail,45deg));
  
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 82%,
    #000 85.5%,#000 91%,transparent 95%);
  mask:radial-gradient(circle closest-side,transparent 0 82%,
    #000 85.5%,#000 91%,transparent 95%);
  filter:blur(2px);mix-blend-mode:plus-lighter}
#orbit .head{left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;
  opacity:var(--gh,.3);transition:opacity 2.4s ease,transform 2.4s ease;
  transform:translateY(-82px) scale(var(--gs,1));
  background:
    radial-gradient(circle,rgba(255,255,255,.95) 0 14%,
                    rgba(255,255,255,0) 42%),
    radial-gradient(circle,rgba(236,242,255,.45) 0 30%,
                    rgba(236,242,255,0) 64%),
    radial-gradient(circle,rgba(200,214,255,.20) 0 48%,
                    rgba(200,214,255,0) 82%);
  filter:blur(2.5px);mix-blend-mode:plus-lighter}
#stword{font-family:var(--disp);font-weight:400;font-size:19px;
  letter-spacing:.3em;margin-top:18px;color:var(--faint);
  padding-left:.3em;transition:color .3s}
#stword.lit{background:var(--silver);-webkit-background-clip:text;
  background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(222,226,234,.25))}
#bypass{height:24px;margin-top:6px;display:flex;align-items:center;
  justify-content:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;color:var(--faint)}
#bypass .bl{margin-right:2px}
#bypass .bp{padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-soft);color:var(--dim);background:none;
  font:inherit;letter-spacing:inherit;transition:color .2s,border-color .2s}
#bypass .bp:hover{color:#e2e5ea;border-color:#3a3b41}
#stmode{font-family:var(--mono);font-size:11px;letter-spacing:.10em;
  text-transform:uppercase;color:var(--faint);margin-top:7px;min-height:15px}
#stsub{font-size:13px;color:var(--dim);margin-top:11px;min-height:18px}
#egline{font-family:var(--mono);font-size:11px;color:var(--faint);
  margin-top:6px;min-height:15px}
#egline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#banner{display:none;margin:16px 0 0;padding:12px 14px;border-radius:12px;
  background:rgba(226,109,90,.07);border:1px solid rgba(226,109,90,.35);
  font-size:12.5px;color:var(--dim);text-align:left}
#banner span{flex:1;min-width:0}
#banner button{flex:none;font-size:12px;font-weight:600;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px}
#banner button:hover{border-color:#3a3b41}
.card{background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:11px 15px;margin-top:11px;text-align:left;
  position:relative;z-index:1}
.card .cl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase}
#spark{width:100%;height:62px;display:block;margin-top:8px}
#speedrow{display:flex;justify-content:space-between;margin-top:8px;
  font-family:var(--mono);font-size:11.5px;color:var(--faint)}
#speedrow b{color:var(--dim);font-weight:500}
body.noperf #stest{display:none}
body.noperf #spark{height:106px}
#stest{display:flex;align-items:center;gap:10px;margin-top:10px;
  border-top:1px solid var(--line-soft);padding-top:9px}
#stestres{flex:1;font-family:var(--mono);font-size:11px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stestres i{font-style:normal;opacity:.62}
.btn.thin{padding:4px 11px;font-size:11px;font-weight:500}
#routehead{display:flex;align-items:center;gap:10px;margin-top:2px}
#routeval{font-size:13.5px;color:var(--text);margin-top:6px;flex:1}
#routems{font-family:var(--mono);font-size:11px;color:var(--faint)}
.latwrap{position:relative;display:inline-flex;flex:none}
.lat{width:7px;height:7px;border-radius:50%;background:#3a3b41;flex:none}
.lat.ok{background:#e2e5ea;box-shadow:0 0 8px rgba(226,229,234,.5)}
#routeopts{display:block;margin-top:12px;border-top:1px solid var(--line-soft);
  padding-top:6px}
.axis{display:flex;align-items:center;gap:10px;margin:9px 0 0}
.axis .al{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);width:62px;flex:none}
.axis .pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;color:var(--faint);
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;cursor:pointer;
  transition:all .15s}
.pill:hover{border-color:#3a3b41;color:var(--dim)}
.pill.sel{color:#101013;background:var(--accent);border-color:var(--accent)}
.axis.opt{align-items:flex-start}
.axis.opt .al{padding-top:2px}
.slwrap{flex:1;min-width:0}
.slends{display:flex;justify-content:space-between;line-height:12px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);pointer-events:none}
.sltrack{position:relative;height:18px;margin-top:1px}
.slbar{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
  border-radius:2px;background:var(--line);pointer-events:none}
.stick{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
  border-radius:50%;background:#3a3b41;pointer-events:none;
  transition:background .15s,box-shadow .15s}
.stick.s0{left:6px}
.stick.s1{left:calc(6px + (100% - 12px) / 4)}
.stick.s2{left:calc(6px + (100% - 12px) * 2 / 4)}
.stick.s3{left:calc(6px + (100% - 12px) * 3 / 4)}
.stick.s4{left:calc(100% - 6px)}
.mrange{-webkit-appearance:none;appearance:none;position:relative;z-index:2;
  display:block;width:100%;height:18px;margin:0;padding:0;background:none;
  border:0;outline:none;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.mrange::-webkit-slider-runnable-track{height:18px;background:transparent;border:0}
.mrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;border:0;background:none;
  cursor:pointer}
.slthumb{position:absolute;top:50%;width:12px;height:12px;
  margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 1px rgba(16,16,19,.9);pointer-events:none;z-index:3;
  left:calc(6px + (100% - 12px) * var(--v) / 4);
  transition:left .26s cubic-bezier(.32,.72,.28,1),transform .12s,
             box-shadow .15s}
.slwrap:hover .slthumb{transform:scale(1.09)}
.mrange:focus-visible ~ .slthumb,.sltrack:has(.mrange:focus-visible) .slthumb{
  box-shadow:0 0 0 1px rgba(16,16,19,.9),0 0 0 3px rgba(255,255,255,.22)}
.slnamewrap{position:relative;height:16px;margin-top:3px}
.slname{position:absolute;top:0;display:inline-flex;align-items:center;
  gap:5px;white-space:nowrap;font-size:12.5px;font-weight:500;
  line-height:16px;color:var(--text);
  left:calc(6px + (100% - 12px) * var(--v) / 4);transform:translateX(-50%);
  transition:left .26s cubic-bezier(.32,.72,.28,1)}
.uwrap{position:relative;display:none}
.uwarn{-webkit-appearance:none;appearance:none;display:inline-flex;
  align-items:center;justify-content:center;width:15px;height:15px;
  padding:0;border:0;background:none;color:var(--red);cursor:pointer}
.uwarn svg{width:13px;height:12px;display:block}
.uwarn svg path{fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linejoin:round}
.uwarn svg rect,.uwarn svg circle{fill:currentColor;stroke:none}
.uwarn:hover,.uwarn:focus-visible{color:#f0a596}
.uwarn:focus-visible{outline:none;border-radius:3px;
  box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.upop{position:absolute;right:-5px;bottom:calc(100% + 9px);width:232px;
  padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font-family:var(--sans);
  font-size:11.5px;font-weight:400;line-height:1.45;white-space:normal;
  text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transform:translateY(3px);
  
  transition:opacity .12s .25s,transform .12s .25s,visibility 0s .37s;
  pointer-events:none;z-index:40}
.uwrap:hover .upop,.uwrap.open .upop,.uwarn:focus-visible + .upop{
  pointer-events:auto}
.upop::before{content:"";position:absolute;left:0;right:0;bottom:-11px;
  height:11px}
.upop::after{content:"";position:absolute;right:10px;bottom:-4px;width:7px;
  height:7px;background:var(--panel);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);transform:rotate(45deg)}
.uwrap:hover .upop{
  opacity:1;visibility:visible;transform:translateY(0);
  transition:opacity .12s .35s,transform .12s .35s,visibility 0s .35s}
.uwrap.open .upop,.uwarn:focus-visible + .upop{
  opacity:1;visibility:visible;transform:translateY(0);
  transition:opacity .12s,transform .12s,visibility 0s}
@media (prefers-reduced-motion: reduce){
.upop,.mrange::-webkit-slider-thumb,.stick{transition:none}
}
.morelink{display:flex;align-items:center;gap:7px;color:var(--faint);
  font-size:12px;padding:9px 4px 3px 30px;cursor:pointer;
  transition:color .15s;user-select:none}
.morelink:hover{color:var(--dim)}
.morelink .chev{display:inline-block;font-size:15px;line-height:1;
  transition:transform .18s;transform-origin:45% 50%}
#manualopts{display:none}
body.settingswin > :not(#adv):not(#srvupd):not(#toast){display:none!important}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--text);padding:7px 13px;
  transition:border-color .15s}
.btn:hover{border-color:#3a3b41}
.btn:disabled{opacity:.4;cursor:default}
.tog{width:36px;height:21px;border-radius:11px;background:#2a2b31;
  position:relative;flex:none;transition:background .18s}
.tog:after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;
  height:16px;border-radius:50%;background:#8e8e8e;transition:all .18s}
.relief{display:flex;align-items:center;gap:10px;margin-top:10px;min-width:0}
.tog.sm{width:30px;height:18px;border-radius:9px}
.tog.sm:after{top:2.5px;left:2.5px;width:13px;height:13px}
.uwarn.cinfo{color:var(--faint);width:16px;height:16px}
.uwarn.cinfo:hover,.uwrap.open .uwarn.cinfo{color:var(--dim)}
.uwarn.cinfo svg{width:15px;height:15px}
.uwarn.cinfo svg .ring{fill:none;stroke:currentColor;stroke-width:1.3}
.uwrap.iwrap{display:inline-flex;position:relative;align-items:center;
  vertical-align:-2px;margin-left:4px}
.uwrap.iwrap .upop{left:-5px;right:auto;width:258px}
.uwrap.iwrap .upop::after{right:auto;left:10px}
#autorow .al{width:auto;white-space:nowrap}
#autorow + .axis{margin-top:15px}
#autorow .uwrap.iwrap{margin-left:-2px}
.ultrack{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;color:var(--dim);cursor:pointer;user-select:none;
  -webkit-user-select:none;white-space:nowrap;transition:opacity .15s}
.ultrack input{position:absolute;opacity:0;width:1px;height:1px;margin:0;
  pointer-events:none}
.ckbox{flex:none;width:13px;height:13px;border-radius:3.5px;
  border:1px solid #3a3b41;background:var(--panel);display:inline-flex;
  align-items:center;justify-content:center;
  transition:background .15s,border-color .15s}
.ckbox svg{width:10px;height:10px;opacity:0;transition:opacity .12s}
.ckbox path{fill:none;stroke:#101013;stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round}
.ultrack:hover .ckbox{border-color:#55565e}
.ultrack input:checked + .ckbox{background:var(--accent);border-color:var(--accent)}
.ultrack input:checked + .ckbox svg{opacity:1}
.ultrack input:focus-visible + .ckbox{box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.ultrack.dis{opacity:.4;cursor:default}
.ultrack.dis:hover .ckbox{border-color:#3a3b41}
#autorow #ultrawrap{margin-left:1px}
.uwarn.gray{color:var(--faint)}
.uwarn.gray:hover,.uwrap.open .uwarn.gray{color:var(--dim)}
#ultrawrap .upop{left:auto;right:-5px;width:268px}
#ultrawrap .upop::after{left:auto;right:10px}
@keyframes bootIn{to{opacity:1}}
@keyframes orbitspin{to{transform:rotate(360deg)}}

/* ================= site capture: the page's <body> IS the window ========= */
html{height:auto;min-height:100vh;display:grid;place-items:center;padding:40px;
  overflow:hidden;
  /* a background image, even an empty one, stops the body's #101013 from
     propagating to the canvas, so the capture stays transparent */
  background:linear-gradient(transparent,transparent)}
body{width:460px;height:856px;flex:none;border-radius:12px;overflow:hidden;
  /* contains the page's position:fixed layers (sky, hairline, shadow) */
  transform:translateZ(0);
  opacity:1;animation:none;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.04);
  outline:1px solid var(--line);outline-offset:-1px}
#stars,#globe{opacity:1;transition:none}
/* macOS chrome over the page's 32px #top strip */
.chrome{position:absolute;left:0;top:0;right:0;height:32px;z-index:120;
  pointer-events:none}
.lights{position:absolute;left:13px;top:10px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
/* zoom is disabled in the app (the window fits its content): the system
   draws a disabled button grey */
.lights i:nth-child(3){background:#4b4c52}
.lockup{position:absolute;left:0;right:0;top:0;height:32px;display:flex;
  align-items:center;justify-content:center;gap:6px}
.lockup svg{display:block;width:15px;height:12.6px}
.lockup b{font-family:var(--disp);font-weight:400;font-size:11.5px;
  letter-spacing:1.7px;color:#fff;line-height:1;margin-right:-1.7px}
/* NSStrokeWidth -12 on "VPN": a stroke 12% of the point size over the fill */
.lockup .tld{-webkit-text-stroke:1.38px #fff}
.gearbtn{position:absolute;right:11px;top:8px;width:16px;height:16px;display:block}
</style>
</head>
<body class="noperf">

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ringg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#8f95a1"/>
    <stop offset=".5" stop-color="#c8ccd5"/>
    <stop offset="1" stop-color="#f5f6f8"/>
  </linearGradient>
</defs></svg>

<header id="top"></header>

<main id="stage">
<div id="globewrap"><canvas id="stars"></canvas><canvas id="globe"></canvas>
  </div>
<section class="view on" id="v-main">
  <div id="hero">
    <button id="power" class="on">

<script>
/* One still frame of the page's own canvases. Everything between the
   VERBATIM markers is concordevpn.py's own code (HEAD), comments dropped. */
const $ = q => document.querySelector(q);
const S = {last: {tun: true}};
const TRAFFIC = [[1,85913,830904],[2,60640,613168],[3,77129,844499],[4,85313,757154],[5,78218,847354],[6,70283,928016],[7,98139,967862],[8,82419,708502],[9,111433,969725],[10,84728,779575],[11,78553,995185],[12,108240,1029143],[13,83385,934405],[14,103900,813985],[15,69988,969124],[16,85568,1022551],[17,97666,891213],[18,86919,897219],[19,55047,703609],[20,98891,714756],[21,74431,818886],[22,83443,907491],[23,93091,839879],[24,74610,710105],[25,91943,1137966],[26,94035,1329656],[27,114276,1551291],[28,168400,2004757],[29,225164,2703650],[30,231535,3106549],[31,265698,3230790],[32,236095,3007900],[33,196096,2647214],[34,178066,2306970],[35,139213,1491636],[36,86080,1093890],[37,102294,787517],[38,77964,458461],[39,65218,284217],[40,50912,360832],[41,68313,474155],[42,29168,272736],[43,60313,186693],[44,37062,98863],[45,53032,403223],[46,33790,125163],[47,23691,152714],[48,45935,239709],[49,23093,303783],[50,15650,191587],[51,63714,311609],[52,41291,176441],[53,50029,77331],[54,54847,111653],[55,66760,420803],[56,52994,252542],[57,52924,555018],[58,76920,855566],[59,120599,1162098],[60,130244,1412744],[61,124773,1758050],[62,140186,1933480],[63,175953,1973923],[64,201130,2364032],[65,160143,2167750],[66,138924,1919920],[67,132325,1759845],[68,99738,1404366],[69,123132,1189208],[70,108825,1049718],[71,77189,901471],[72,49324,635951],[73,52211,573280],[74,50312,486119],[75,92688,742028],[76,93092,630748],[77,65694,527006],[78,93938,648710],[79,67381,948937],[80,90149,1167659],[81,126546,1221064],[82,163286,1713862],[83,165938,1777459],[84,175986,1809681],[85,164565,1961478],[86,115136,1567313],[87,132616,1294935],[88,114363,950771],[89,106930,872133],[90,59431,808042]];
/* ---- VERBATIM: drawSpark ---- */
const SPARK_SPAN = 90;
function drawSpark(){
  const c = $("#spark"), t = S.spkData || [];
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  if (c.width !== W*dpr || c.height !== H*dpr){
    c.width = W*dpr; c.height = H*dpr;
  }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  if (t.length < 2) return;
  const gaps = [];
  for (let i = Math.max(1, t.length - 6); i < t.length; i++){
    const d = t[i][0] - t[i-1][0];
    if (d > 0) gaps.push(d);
  }
  gaps.sort((a, b) => a - b);
  const step = gaps.length ? gaps[gaps.length >> 1] : 1;
  const span = step * (SPARK_SPAN - 1);
  if (!(span > 0)) return;
  let drift = (performance.now() - (S.spkAt || 0)) / 1000;
  if (!(drift >= 0)) drift = 0;
  if (drift > step * 3) drift = step * 3;
  const nowTs = (S.spkTs || t[t.length-1][0]) + drift - step;
  const perSec = W / span;
  const px = ts => W - (nowTs - ts) * perSec;
  const target = Math.max(65536,
    ...t.map(x => x[1]), ...t.map(x => x[2]));
  if (!(S.spkMax > 0) || target > S.spkMax) S.spkMax = target;
  else S.spkMax += (target - S.spkMax) * 0.05;
  const max = S.spkMax;
  const py = v => H - 2 - (v/max) * (H-6);

  g.beginPath(); g.moveTo(px(t[0][0]), H);
  t.forEach(x => g.lineTo(px(x[0]), py(x[2])));
  g.lineTo(px(t[t.length-1][0]), H); g.closePath();
  g.fillStyle = "rgba(236,236,236,.10)"; g.fill();
  g.beginPath();
  t.forEach((x, i) => g[i ? "lineTo" : "moveTo"](px(x[0]), py(x[2])));
  g.strokeStyle = "rgba(236,236,236,.65)"; g.lineWidth = 1.4; g.stroke();
  g.beginPath();
  t.forEach((x, i) => g[i ? "lineTo" : "moveTo"](px(x[0]), py(x[1])));
  g.strokeStyle = "rgba(180,180,180,.38)"; g.lineWidth = 1.1; g.stroke();
}
/* ---- VERBATIM: drawGlobe ---- */
function drawGlobe(t){
  const c = $("#globe");
  if (!c.clientWidth) return;
  const on = $("#v-main").classList.contains("on");
  c.style.opacity = on ? "1" : "0";
  if (!on) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth,
        H = c.clientHeight;
  if (c.width !== W*dpr){ c.width = W*dpr; c.height = H*dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const R = W*0.46, cx = W/2, cy = H/2, tilt = 0.35, rot = t/14300;
  const P = (lat, lon) => {
    const x = Math.cos(lat)*Math.sin(lon+rot), y = Math.sin(lat),
          z = Math.cos(lat)*Math.cos(lon+rot);
    const y2 = y*Math.cos(tilt) - z*Math.sin(tilt),
          z2 = y*Math.sin(tilt) + z*Math.cos(tilt);
    return [cx + R*x, cy - R*y2, z2];
  };
  const line = pts => {
    for (const [alpha, keep] of [[.085, z => z >= 0], [.035, z => z < 0]]){
      g.strokeStyle = "rgba(236,236,236," + alpha + ")";
      g.lineWidth = 1;
      g.beginPath();
      let pen = false;
      for (const [x, y, z] of pts){
        if (keep(z)){ pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; }
        else pen = false;
      }
      g.stroke();
    }
  };
  const N = 72;
  for (let m = 0; m < 24; m++){
    const lon = m*Math.PI/12, pts = [];
    for (let i = 0; i <= N; i++)
      pts.push(P(-Math.PI/2 + i*Math.PI/N, lon));
    line(pts);
  }
  for (let p = -8; p <= 8; p++){
    const lat = p*Math.PI/18, pts = [];
    for (let i = 0; i <= N; i++) pts.push(P(lat, i*2*Math.PI/N));
    line(pts);
  }
  if (S.arc){
    const pts = arcPoints(S.arc.from, S.arc.to, 96).map(c => P(c[0], c[1]));
    g.lineWidth = 1.6;
    g.strokeStyle = "rgba(214,226,255,.5)";
    g.beginPath();
    let pen = false;
    for (const [x, y, z] of pts){
      if (z >= 0){ pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; }
      else pen = false;
    }
    g.stroke();
    for (const c of [S.arc.from, S.arc.to]){
      const [x, y, z] = P(c[0]*Math.PI/180, c[1]*Math.PI/180);
      if (z < 0) continue;
      g.beginPath(); g.arc(x, y, 2.6, 0, 6.2832);
      g.fillStyle = "rgba(226,236,255,.75)"; g.fill();
    }
    const f = (t % 6000) / 6000;
    const at = pts[Math.floor(f * (pts.length - 1))];
    if (at && at[2] >= 0){
      g.beginPath(); g.arc(at[0], at[1], 2.2, 0, 6.2832);
      g.fillStyle = "rgba(255,255,255,.95)"; g.fill();
    }
  }
}
/* ---- VERBATIM: the sky (starRand, starsInit, drawStars) ---- */
function starRand(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let STARS = null, _starsT = 0;
function starsInit(W, H){
  const rnd = starRand(0x0C0FDE);
  const n = Math.max(90, Math.min(380, Math.round(W*H/2000)));
  const pts = [];
  for (let i = 0; i < n; i++){
    const r = 0.35 + rnd()*rnd()*0.85;
    pts.push({x: rnd()*W, y: rnd()*H, r,
      a: 0.10 + rnd()*0.34, blue: rnd() < 0.35,
      v: 0.55 + (r - 0.35) / 0.85 * 0.9,
      ph: rnd()*6.2832, tw: 7 + rnd()*9});
  }
  STARS = {pts, W, H};
}
function drawStars(t){
  const c = $("#stars");
  if (!c.clientWidth) return;
  const on = $("#v-main").classList.contains("on");
  c.style.opacity = on ? "1" : "0";
  if (!on){ _starsT = 0; return; }
  const dpr = window.devicePixelRatio || 1,
        W = c.clientWidth, H = c.clientHeight;
  if (c.width !== W*dpr || c.height !== H*dpr){
    c.width = W*dpr; c.height = H*dpr; STARS = null;
  }
  if (!STARS || STARS.W !== W || STARS.H !== H) starsInit(W, H);
  const want = (S.last && S.last.tun) ? 1 : 0;
  if (S.skyLive === undefined) S.skyLive = want;
  S.skyLive += (want - S.skyLive) * 0.04;
  const live = S.skyLive;
  const dt = _starsT ? Math.min(0.1, (t - _starsT) / 1000) : 0;
  _starsT = t;
  const speed = 2.2 + 2.8*live;
  const hx = 0.94, hy = -0.34;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const sec = t / 1000;
  for (const s of STARS.pts){
    s.x += hx * speed * s.v * dt; s.y += hy * speed * s.v * dt;
    if (s.x > W+2) s.x -= W+4; else if (s.x < -2) s.x += W+4;
    if (s.y > H+2) s.y -= H+4; else if (s.y < -2) s.y += H+4;
    const fade = Math.max(0, Math.min(1, (0.70 - s.y/H) / 0.22));
    if (fade <= 0) continue;
    let a = s.a * fade * (1 + 0.35*live);
    if (live > 0.01 && s.r > 0.8)
      a *= 1 + 0.28*live*Math.sin(sec / s.tw * 6.2832 + s.ph);
    g.fillStyle = (s.blue ? "rgba(202,216,248," : "rgba(244,246,252,")
                + a.toFixed(3) + ")";
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
  }
}
/* ---- end VERBATIM ---- */
S.spkData = TRAFFIC;
S.spkTs = TRAFFIC[TRAFFIC.length - 1][0];
S.spkAt = Infinity;      // drift 0: the newest sample just off the right edge
drawSpark();
// The sky drifts in the app. Play 5 s of frames into t=30000 so the frozen
// field leaves no star against a small line of text, where it would read as
// punctuation (at 0 s one sat right after "MODE: BALANCED").
for (let t = 25000; t <= 30000; t += 16) drawStars(t);
drawStars(30000);
drawGlobe(30000);
</script>
