<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zoar Video Window</title>
<!--
  Zoar Video's card picture: three stills from sample films made with Zoar
  Video (Loop, Bull Run, Somewhere Up There), each the film's own YouTube
  poster frame with the letterbox trimmed (zoar-*.jpg). Not a mock of Zoar's
  interface: Zoar's own screens hold the owner's projects, so they never go
  on the site. Every face is a fictional character drawn from a written
  description. Swap a still by replacing its jpg and re-running make-shots.py.
-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{margin:0;height:auto;min-height:100vh;display:grid;place-items:center;padding:60px;
  box-sizing:border-box;overflow:hidden;background:linear-gradient(transparent,transparent)}
body{margin:0;position:relative;width:1180px;height:1190px;flex:none;border-radius:12px;overflow:hidden;
  background:#0b0b0e;transform:translateZ(0);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.07);
  outline:1px solid #26272c;outline-offset:-1px;
  font-family:'Space Grotesk',system-ui,sans-serif;color:#ececec}
.bar{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #1e1f23;position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.bar b{position:absolute;left:50%;transform:translateX(-50%);font:500 12px/1 'IBM Plex Mono',monospace;
  letter-spacing:.18em;text-transform:uppercase;color:#8e8e8e}
.grid{padding:28px 28px 0;display:grid;grid-template-columns:1fr 1fr;gap:22px}
figure{margin:0;position:relative}
figure.big{grid-column:1/3}
figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 30%;border-radius:10px}
figure figcaption{display:flex;align-items:baseline;gap:12px;margin-top:12px}
figcaption b{font-weight:600;font-size:22px}
figcaption span{font:400 13px/1 'IBM Plex Mono',monospace;color:#8e8e8e;letter-spacing:.04em}
.big figcaption b{font-size:28px}
.play{position:absolute;left:50%;top:calc(50% - 22px);transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;
  background:rgba(10,10,12,.55);border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;backdrop-filter:blur(6px)}
.play::after{content:"";margin-left:6px;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
figure:not(.big) .play{width:56px;height:56px;top:calc(50% - 20px)}
figure:not(.big) .play::after{border-left-width:15px;border-top-width:10px;border-bottom-width:10px;margin-left:4px}
</style>
</head>
<body>
<div class="bar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><b>Sample films · made with Zoar Video</b></div>
<div class="grid">
  <figure class="big"><img src="zoar-loop.jpg" alt=""><i class="play"></i><figcaption><b>Loop</b><span>sci-fi · 15 min</span></figcaption></figure>
  <figure><img src="zoar-bullrun.jpg" alt=""><i class="play"></i><figcaption><b>Bull Run</b><span>comedy · 15 min</span></figcaption></figure>
  <figure><img src="zoar-upthere.jpg" alt=""><i class="play"></i><figcaption><b>Somewhere Up There</b><span>music video</span></figcaption></figure>
</div>
</body>
</html>
