<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConcordeAI Window</title>
<!--
  ConcordeAI 7.0 as it opens: the Horizon home, a 2x capture of the app's REAL
  page (millenai.py), served by the app's own dev copy (MILLENAI_DEV=1,
  MILLENAI_NOWINDOW=1, a throwaway MILLENAI_HOME, so no chats, no accounts, no
  servers), after its intro, with Visual effects on and a question typed into
  the composer but not sent. 1180 x 1240 CSS px: the page's own size, the
  shape of the old 1000 x 1060 window, so shot-ai stays 1458 x 1532. The
  greeting is drawn by time of day in the app; any is fine. The sky here is
  the app's own near-black aurora; it plays no Apple footage. The native
  titlebar is transparent in the app, so only the three window lights are
  drawn here, over the page's top left. tools/README.md says how to retake
  ai-capture.png.
-->
<style>
html{margin:0;height:auto;min-height:100vh;display:grid;place-items:center;padding:60px;
  box-sizing:border-box;overflow:hidden;background:linear-gradient(transparent,transparent)}
body{margin:0;position:relative;width:1180px;height:1240px;flex:none;border-radius:12px;overflow:hidden;
  background:#08090b url(ai-capture.png) 0 0/1180px 1240px no-repeat;
  transform:translateZ(0);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.07);
  outline:1px solid #26272c;outline-offset:-1px}
.lights{position:absolute;left:14px;top:8px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
</style>
</head>
<body>
<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
</body>
</html>
